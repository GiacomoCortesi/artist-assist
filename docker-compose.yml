name: artistassist

services:
  backend:
    build:
      context: ./backend
    container_name: artistassist-backend
    env_file:
      - .env
    volumes:
      - artistassist-data:/app/data
      - artistassist-storage:/app/storage
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: artistassist-caddy
    ports:
      - "8080:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  artistassist-data:
  artistassist-storage:
  caddy-data:
  caddy-config:
