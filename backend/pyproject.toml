[project]
name = "artistassist-backend"
version = "0.1.0"
description = "ArtistAssist API — private musician social media assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "sqlalchemy>=2.0.36",
  "aiosqlite>=0.20.0",
  "cryptography>=43.0.0",
  "httpx>=0.27.0",
  "apscheduler>=3.10.4",
  "python-multipart>=0.0.12",
  "pillow>=11.0.0",
  "openai>=1.54.0",
  "anthropic>=0.40.0",
  "pyyaml>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.7.0",
  "httpx>=0.27.0",
  "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # FastAPI Depends() in defaults is idiomatic
  "E501",  # line length; keep readable adapter fixtures
]
